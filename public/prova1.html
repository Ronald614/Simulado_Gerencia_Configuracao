<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado Somativo 01 - Preparacao para a Prova de Gerencia de Configuracao</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <span class="badge">IC / UFAM</span>
        <span class="badge">Simulado 01</span>
      </div>
      <h1 id="prova-titulo">Carregando Prova 01...</h1>
      <p class="subtitle" id="prova-subtitulo">Aguarde um instante enquanto as questoes sao preparadas...</p>
      <div class="nav-links">
        <a href="/" class="btn btn-outline">Inicio</a>
        <a href="/prova1" class="btn btn-primary">Prova 01</a>
        <a href="/prova2" class="btn btn-outline">Prova 02</a>
        <a href="/prova3" class="btn btn-outline">Prova 03</a>
        <a href="/api/provas?id=prova_01" target="_blank" class="btn btn-outline">JSON Endpoint</a>
      </div>
    </header>

    <main id="prova-container">
      <div id="questoes-container"></div>

      <div class="score-bar">
        <div style="font-size: 16px; font-weight: 700;" id="score-display">Nota: -- / 10.0 pontos</div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-outline" onclick="resetarRespostas()">Limpar Respostas</button>
          <button class="btn btn-primary" onclick="conferirRespostas()">Conferir Gabarito</button>
        </div>
      </div>
    </main>

    <footer>
      <p>Gerencia de Configuracao - Instituto de Computacao (IC/UFAM) - Vercel Ready</p>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initProva('prova_01');
    });
  </script>
</body>
</html>
